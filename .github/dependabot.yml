# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Security updates: Dependabot opens security-update PRs automatically once
# "Dependabot security updates" is enabled in the repository settings
# (Settings > Code security). The version-update entries below keep the
# manifests current and let Dependabot group and label those PRs.
version: 2
updates:
  # The starter-vite-react skill asset. It's a Bun project (packageManager:
  # bun), so use the dedicated `bun` ecosystem rather than `npm` — it reads
  # package.json and keeps a bun.lock in sync if one is ever committed.
  - package-ecosystem: "bun"
    directories:
      - "/skills/amsterdam-design-system/assets/starter-vite-react"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      # Batch routine minor/patch bumps into one PR
      deps-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # Batch security fixes together so they land in a single review
      deps-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
